<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushline studio</title><link rel="stylesheet" href="/static/studio.css"></head>
<body>
<header><strong>Brushline studio</strong><span id="summary">loading…</span><select id="skin" aria-label="Skin"></select></header>
<main>
<section id="map-panel"><h2>Corridor map</h2><svg id="map" viewBox="0 0 800 260" aria-label="Corridor map"></svg><p id="map-hint">Select a block to inspect.</p></section>
<section id="scene-panel"><h2>3D context / forester walkthrough</h2><canvas id="scene" width="800" height="420"></canvas>
<div id="walk-hud" hidden></div><div class="actions"><button id="walk">Walk this block</button><button id="toggle" disabled>Pre / Post</button><span id="variant">pre</span></div>
<p class="caveat">Context view only. Positions are unknown unless supplied; pre/post is model state, not a survey.</p></section>
<section id="results"><h2>Pareto archive</h2><div id="pareto"></div><h2>Operations timeline</h2><div id="timeline"></div><button id="play">Play</button></section>
</main>
<script src="/static/studio.js"></script></body></html>
