<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushline studio</title><link rel="stylesheet" href="static/studio.css?v=20261117-50"></head>
<body>
<header><strong>Brushline studio</strong><select id="instance" aria-label="Model instance"></select><span id="summary">loading…</span><select id="skin" aria-label="Skin"></select><a id="brief-link" class="brief-link" href="#" target="_blank" rel="noopener" hidden>Planning brief</a></header>
<main>
<section id="map-panel"><h2>Corridor map</h2><div id="time-control" hidden><label for="year">Modelled year</label><input id="year" type="range" min="2026" max="2031" step="1" value="2026"><output id="year-label">2026 observed</output></div><svg id="map" viewBox="0 0 800 260" aria-label="Corridor map"></svg><p id="map-hint">Select a block to inspect.</p><p class="caveat" id="provenance"></p></section>
<section id="scene-panel"><h2>3D context / forester walkthrough</h2><canvas id="scene" width="800" height="420"></canvas>
<div id="walk-hud" hidden></div><div class="actions"><button id="walk">Walk this block</button><button id="toggle" disabled>Pre / Post</button><span id="variant">pre</span></div>
<p class="caveat" id="scene-caveat">Context view only. Positions are unknown unless supplied; pre/post is model state, not a survey.</p></section>
<section id="results"><h2 id="schedule-heading">Corridor treatment schedule</h2><div id="schedule"></div><h2 id="pareto-heading">Pareto archive</h2><div id="pareto"></div><h2 id="timeline-heading">Operations timeline</h2><div id="timeline"></div><button id="play">Play</button></section>
</main>
<script type="importmap">{"imports":{"three":"./static/vendor/three/three.module.js","three/addons/":"./static/vendor/three/"}}</script>
<script src="static/studio.js?v=20261117-50"></script>
<script type="module" src="static/studio3d.js?v=20261117-50"></script></body></html>
